name: Build and release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'evidence/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Unit tests
        run: |
          python -c "from runtime_bundle import restore_runtime; restore_runtime()"
          python -X utf8 -m unittest discover -s tests -v
      - name: Build and verify public package
        run: python -X utf8 build_release.py --offline --use-prebuilt-runtime --edition public
      - name: Publish versioned update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 publish_release.py --publish
      - name: Keep build verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          path: |
            projects/frozen-*.json
            projects/build-*.log
          if-no-files-found: ignore
